name: Check upstream scheme dataset revision

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: janasetu-scheme-dataset-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Fetch and validate the publisher revision
        run: |
          python scripts/refresh_smartduke_snapshot.py
          python scripts/audit_smartduke_snapshot.py

      - name: Create or recover the human-review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/smartduke-snapshot.json.gz data/smartduke-snapshot-meta.json; then
            echo "No new publisher revision; the known-good snapshot remains unchanged."
            exit 0
          fi

          revision="$(python -c 'import json; print(json.load(open("data/smartduke-snapshot-meta.json"))["revision"][:12])')"
          branch="data-refresh/smartduke-${revision}"
          existing_pr_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" --json number --jq 'length')"
          if [[ "$existing_pr_count" -gt 0 ]]; then
            echo "A review PR for publisher revision ${revision} is already open."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Recovering the existing validated branch without rewriting it."
            git fetch origin "$branch"
            git switch --track -c "$branch" "origin/$branch"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add data/smartduke-snapshot.json.gz data/smartduke-snapshot-meta.json docs/smartduke-catalogue-audit.json docs/smartduke-record-review-queue.csv
            if git diff --cached --quiet; then
              echo "No validated dataset changes to publish."
              exit 0
            fi
            git commit -m "Refresh SmartDuke catalogue snapshot ${revision}"
            git push --set-upstream origin "$branch"
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$branch" \
            --title "Review updated SmartDuke scheme catalogue snapshot ${revision}" \
            --body "A new publisher revision was detected and validated. This PR updates the local full-text discovery index only. It does not approve scheme eligibility rules or establish official source accuracy. Review the source diff, collection date, data quality and attribution before merging. All imported records remain catalogue-only. CI runs automatically on this pull request; no dataset change is auto-merged."
