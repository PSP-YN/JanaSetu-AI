name: JanaSetu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: janasetu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, security and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Validate Chrome extension syntax and manifest
        run: |
          node --check extension/popup.js
          node -e 'JSON.parse(require("node:fs").readFileSync("extension/manifest.json", "utf8"))'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        run: npm run build

      - name: Smoke-test production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/janasetu-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/janasetu-health.json; then
              break
            fi
            sleep 2
          done

          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("/tmp/janasetu-health.json", "utf8"));
            if (health.ok !== true) throw new Error("Health endpoint did not return ok=true");
          '

          curl --fail --silent http://127.0.0.1:3000/api/schemes > /tmp/janasetu-schemes.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("/tmp/janasetu-schemes.json", "utf8"));
            if (!Array.isArray(data.schemes) || data.schemes.length < 1) {
              throw new Error("Scheme catalogue smoke test failed");
            }
          '

          curl --fail --silent http://127.0.0.1:3000/api/sources/health > /tmp/janasetu-sources.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/janasetu-sources.json", "utf8"));
            if (!Array.isArray(report.sources) || !report.sources.some((source) => source.id === "smartduke-scheme-catalogue")) {
              throw new Error("Source freshness monitoring contract failed");
            }
            if (!report.sources.some((source) => source.id === "official-myscheme" && source.availability === "not_automatically_checked")) {
              throw new Error("Official myScheme must not be automatically scraped");
            }
          '

          curl --fail --silent http://127.0.0.1:3000/privacy > /tmp/janasetu-privacy.html
          curl --fail --silent http://127.0.0.1:3000/terms > /tmp/janasetu-terms.html
          node -e '
            const fs = require("node:fs");
            for (const path of ["/tmp/janasetu-privacy.html", "/tmp/janasetu-terms.html"]) {
              const html = fs.readFileSync(path, "utf8");
              if (!html.includes("JanaSetu") || html.length < 500) throw new Error("Policy page smoke test failed: " + path);
            }
          '

          intake_status=$(curl --silent --output /tmp/janasetu-intake-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/intake/parse -H "Content-Type: application/json" --data "{}")
          test "$intake_status" = "400"
          draft_status=$(curl --silent --output /tmp/janasetu-draft-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/applications/draft -H "Content-Type: application/json" --data '{"schemeId":"not-a-scheme","profile":{"state":"Karnataka"}}')
          test "$draft_status" = "404"
          agent_status=$(curl --silent --output /tmp/janasetu-agent-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/agent/run -H "Content-Type: application/json" --data '{"fullName":"'$(printf 'x%.0s' {1..101})'","state":"Karnataka"}')
          test "$agent_status" = "400"
