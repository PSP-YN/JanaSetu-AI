name: JanaSetu CI

on:
  push:
    branches: [main, feat/cross-device-pmkisan-assistant]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janasetu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, security and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Set up Python for catalogue integrity checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Verify reproducible third-party catalogue audit
        run: |
          python scripts/audit_smartduke_snapshot.py
          git diff --exit-code -- docs/smartduke-catalogue-audit.json docs/smartduke-record-review-queue.csv

      - name: Verify independent scheme-review packets remain unapproved
        run: python scripts/validate_scheme_review_packets.py

      - name: Validate database RLS and citizen automation guardrails
        run: python scripts/validate_database_migration.py

      - name: Test private document scanner protocol and fail-closed validation
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build the private ClamAV scanner container
        run: docker build --pull --tag janasetu-document-scanner:test services/document-scanner

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Install Chromium for browser tests
        # GitHub-hosted Ubuntu runners already include the browser system libraries.
        # Avoid apt-based --with-deps here: transient runner DNS/mirror failures
        # otherwise prevent browser tests from running at all.
        run: npx playwright install chromium

      - name: Build production app and run browser accessibility tests
        run: npm run test:e2e

      - name: Validate Chrome extension syntax and manifest
        run: |
          node --check extension/popup.js
          node --check extension/fill.js
          node -e 'JSON.parse(require("node:fs").readFileSync("extension/manifest.json", "utf8"))'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/janasetu-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/janasetu-health.json; then
              break
            fi
            sleep 2
          done

          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("/tmp/janasetu-health.json", "utf8"));
            if (health.ok !== true) throw new Error("Health endpoint did not return ok=true");
          '

          curl --fail --silent http://127.0.0.1:3000/ > /tmp/janasetu-home.html
          grep -q 'JanaSetu AI' /tmp/janasetu-home.html
          grep -q 'href="/app"' /tmp/janasetu-home.html
          curl --fail --silent http://127.0.0.1:3000/app > /tmp/janasetu-app.html
          grep -q 'GOVERNMENT BENEFITS WORKSPACE' /tmp/janasetu-app.html

          curl --fail --silent --show-error --head http://127.0.0.1:3000/ > /tmp/janasetu-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/janasetu-headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/janasetu-headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/janasetu-headers.txt
          grep -qi '^permissions-policy: camera=(), geolocation=(), payment=(), usb=(), microphone=(self)' /tmp/janasetu-headers.txt
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' /tmp/janasetu-headers.txt
          grep -qi '^content-security-policy-report-only:' /tmp/janasetu-headers.txt

          curl --fail --silent http://127.0.0.1:3000/janasetu-logo.png > /tmp/janasetu-logo.png
          node -e '
            const fs = require("node:fs");
            const logo = fs.readFileSync("/tmp/janasetu-logo.png");
            const signature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
            if (logo.length < 100 || !logo.subarray(0, 8).equals(signature)) throw new Error("Uploaded JanaSetu logo is missing or is not a valid PNG");
          '
          curl --fail --silent http://127.0.0.1:3000/hero-citizen.svg | grep -q '<svg'
          curl --fail --silent http://127.0.0.1:3000/robots.txt | grep -q 'Sitemap:'
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml | grep -q 'jana-setu-ai.vercel.app'
          for locale in hi kn te ta ml; do
            curl --fail --silent "http://127.0.0.1:3000/$locale" > "/tmp/janasetu-$locale.html"
            grep -q 'FAQPage' "/tmp/janasetu-$locale.html"
          done
          curl --fail --silent http://127.0.0.1:3000/llms.txt | grep -qi 'not a government website'
          curl --fail --silent http://127.0.0.1:3000/llms-full.txt | grep -qi 'official government source'
          curl --fail --silent http://127.0.0.1:3000/sitemap.xml | grep -q '/hi'
          curl --fail --silent http://127.0.0.1:3000/opengraph-image > /tmp/janasetu-og.png
          node -e 'const fs=require("node:fs");const b=fs.readFileSync("/tmp/janasetu-og.png");if(b.length<100||!b.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))throw new Error("Open Graph image is not a valid PNG")'

          curl --fail --silent http://127.0.0.1:3000/api/schemes > /tmp/janasetu-schemes.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("/tmp/janasetu-schemes.json", "utf8"));
            if (!Array.isArray(data.schemes) || data.schemes.length < 1) throw new Error("Scheme catalogue smoke test failed");
            if (data.catalogueTotal !== 142 || data.budgetLineItemLeadTotal !== 96 || data.officialSourceCatalogueOnlyTotal !== 42) throw new Error("Catalogue provenance counts changed unexpectedly");
          '

          curl --fail --silent 'http://127.0.0.1:3000/api/schemes/open-data?q=zupda%20vijlikaran&offset=0&limit=50' > /tmp/janasetu-open-data-search.json
          node -e '
            const fs = require("node:fs");
            const meta = JSON.parse(fs.readFileSync("data/smartduke-snapshot-meta.json", "utf8"));
            const data = JSON.parse(fs.readFileSync("/tmp/janasetu-open-data-search.json", "utf8"));
            if (data.searchMode !== "local-full-index" || data.searchFallbackWarning !== true || data.catalogueTotal !== meta.rowsTotal || data.total < 1) throw new Error("Full local catalogue search smoke test failed");
          '

          curl --fail --silent http://127.0.0.1:3000/api/sources/health > /tmp/janasetu-sources.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/janasetu-sources.json", "utf8"));
            if (!Array.isArray(report.sources) || !report.sources.some((source) => source.id === "smartduke-scheme-catalogue")) {
              throw new Error("Source freshness monitoring contract failed");
            }
            if (!report.sources.some((source) => source.id === "official-myscheme" && source.availability === "not_automatically_checked")) {
              throw new Error("Official myScheme must not be automatically scraped");
            }
          '

          curl --fail --silent http://127.0.0.1:3000/privacy > /tmp/janasetu-privacy.html
          curl --fail --silent http://127.0.0.1:3000/terms > /tmp/janasetu-terms.html
          node -e '
            const fs = require("node:fs");
            for (const path of ["/tmp/janasetu-privacy.html", "/tmp/janasetu-terms.html"]) {
              const html = fs.readFileSync(path, "utf8");
              if (!html.includes("JanaSetu") || html.length < 500) throw new Error("Policy page smoke test failed: " + path);
            }
          '

          intake_status=$(curl --silent --output /tmp/janasetu-intake-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/intake/parse -H "Content-Type: application/json" --data "{}")
          test "$intake_status" = "400"
          draft_status=$(curl --silent --output /tmp/janasetu-draft-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/applications/draft -H "Content-Type: application/json" --data '{"schemeId":"not-a-scheme","profile":{"state":"Karnataka"}}')
          test "$draft_status" = "404"
          agent_status=$(curl --silent --output /tmp/janasetu-agent-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/agent/run -H "Content-Type: application/json" --data '{"fullName":"'$(printf 'x%.0s' {1..101})'","state":"Karnataka"}')
          test "$agent_status" = "400"

# Full CI validates the scheme adapter contract and encrypted workspace sync boundary.
