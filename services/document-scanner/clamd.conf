DatabaseDirectory /var/lib/clamav
LogTime yes
LogSyslog no
Foreground yes
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 660
User clamav
TCPSocket 3310
TCPAddr 127.0.0.1
StreamMaxLength 15M
MaxThreads 2
MaxQueue 10
ReadTimeout 120
CommandReadTimeout 30
